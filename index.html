[...new Set(D.map(f=>f.ville.split("(")[0].trim()))].sort().forEach(v=>$("#ville").add(new Option(v,v)));
[...new Set(D.map(cuis).filter(Boolean))].sort().forEach(v=>$("#cuisine").add(new Option(v,v)));
function map(f){const q=encodeURIComponent([f.nom.split("(")[0],f.adresse||f.quartier,f.ville].filter(Boolean).join(" "));return "https://maps.apple.com/?q="+q}
function render(){
  const q=norm($("#q").value),v=$("#ville").value,c=$("#cuisine").value;
  const L=D.filter(f=>(!v||f.ville.startsWith(v))&&(!c||cuis(f)===c)&&(!q||norm(JSON.stringify(f)).includes(q)));
  $("#count").textContent=L.length+" adresse"+(L.length>1?"s":"");
  $("#list").innerHTML=L.map(f=>`<article class="card"><h2>${f.nom}</h2>
  <div class="sub">${[f.sous_type,f.cuisine].filter(Boolean).join(" · ")}</div>
  <div class="sub">${[f.ville,f.quartier].filter(Boolean).join(" · ")}${f.adresse?"<br>"+f.adresse:""}</div>
  ${f.plats.length?`<div class="plats">🍽️ ${f.plats.join(", ")}</div>`:""}
  ${f.infos?`<div class="info">${f.infos}</div>`:""}
  ${f.a_verifier.length?`<div class="warn">⚠️ À vérifier : ${f.a_verifier.join(" ")}</div>`:""}
  <div class="links"><a href="${map(f)}">📍 Plans</a>${f.sources.filter(s=>s.url).map((s,i,a)=>`<a href="${s.url}">▶︎ Reel${a.length>1?" "+(i+1):""}</a>`).join("")}${f.sources.some(s=>!s.url)?`<span class="sub">📝 ${f.sources.filter(s=>!s.url).map(s=>s.note).join(", ")}</span>`:""}</div></article>`).join("");
}
["q","ville","cuisine"].forEach(i=>$("#"+i).addEventListener("input",render));render();
</script></body></html>
