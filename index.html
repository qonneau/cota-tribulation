<style>
:root{--bg:#f6f4f0;--card:#fff;--fg:#2b2a28;--mut:#8a857d;--acc:#9a6b4b;--bd:#e6e1d9;--warn:#b8860b}
@media(prefers-color-scheme:dark){:root{--bg:#171615;--card:#222120;--fg:#ece8e2;--mut:#9b958c;--acc:#d3a37f;--bd:#34312e;--warn:#e0b84a}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,sans-serif;padding-top:env(safe-area-inset-top)}
header{position:sticky;top:0;background:var(--bg);padding:12px 14px 8px;border-bottom:1px solid var(--bd);z-index:1000}
h1{font-size:20px;margin:0 0 8px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
input,select,button{padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--fg);font-size:16px;font-family:inherit}
input{width:100%}.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1;min-width:0}
button.act{background:var(--acc);color:#fff;border-color:var(--acc)}
.tabs{display:flex;gap:6px;margin-top:8px}.tabs button{flex:1}.tabs button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.count{color:var(--mut);font-size:13px;margin-top:6px}
main{padding:12px 14px 40px;display:grid;gap:10px;max-width:760px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.card h2{margin:0 0 2px;font-size:17px;display:flex;justify-content:space-between;gap:8px}.dist{font-size:13px;color:var(--acc);white-space:nowrap}
.sub{color:var(--mut);font-size:13px}.plats{margin:8px 0 0;font-size:14px}.info{margin:8px 0 0;font-size:14px;color:var(--mut)}
.warn{margin:8px 0 0;font-size:13px;color:var(--warn)}
a{color:var(--acc);text-decoration:none}.links{margin-top:10px;font-size:14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
#mapwrap{display:none;position:relative}#map{height:calc(100vh - 230px);min-height:340px;border-radius:14px;border:1px solid var(--bd)}
.banner{display:none;margin:0 14px;padding:10px 12px;border-radius:12px;background:var(--acc);color:#fff;font-size:14px}
.pin{width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px #0006}
.pin.sure{background:#9a6b4b}.pin.probable{background:#c9a27e}.pin.approx{background:#fff;border-color:#9a6b4b;opacity:.9}
.me{width:16px;height:16px;border-radius:50%;background:#2f7de1;border:3px solid #fff;box-shadow:0 0 0 6px #2f7de155}
.leaflet-popup-content{font:14px/1.35 -apple-system,system-ui,sans-serif}

function plans(f){const g=f.geo;return g?`https://maps.apple.com/?ll=${g.lat},${g.lng}&q=${encodeURIComponent(f.nom.split("(")[0])}`:`https://maps.apple.com/?q=${encodeURIComponent([f.nom.split("(")[0],f.ville].join(" "))}`}
function filtered(){
  const q=norm($("#q").value),v=$("#ville").value,c=$("#cuisine").value,R=parseFloat($("#rayon").value);
  let L=D.filter(f=>(!v||f.ville.startsWith(v))&&(!c||cuis(f)===c)&&(!q||norm(JSON.stringify(f)).includes(q)));
  if(me){L.forEach(f=>f._d=f.geo?km(me,f.geo):null);
    if(R>0)L=L.filter(f=>f._d!==null&&f._d<=R);
    L.sort((a,b)=>(a._d??1e9)-(b._d??1e9));}
  else L.forEach(f=>f._d=null);
  return L}
function card(f){const g=f.geo,flag=g&&g.fiabilite!=="sure"?(g.fiabilite==="probable"?" · position probable":" · position approximative"):"";
  return `<article class="card"><h2><span>${f.nom}</span>${f._d!=null?`<span class="dist">${fmt(f._d)}</span>`:""}</h2>
  <div class="sub">${[f.sous_type,f.cuisine].filter(Boolean).join(" · ")}</div>
  <div class="sub">${[f.ville,f.quartier].filter(Boolean).join(" · ")}${f.adresse?"<br>"+f.adresse:""}${flag}</div>
  ${f.plats.length?`<div class="plats">🍽️ ${f.plats.join(", ")}</div>`:""}
  ${f.infos?`<div class="info">${f.infos}</div>`:""}
  ${f.a_verifier.length?`<div class="warn">⚠️ À vérifier : ${f.a_verifier.join(" ")}</div>`:""}
  <div class="links"><a href="${plans(f)}">📍 Plans</a>${f.sources.filter(s=>s.url).map((s,i,a)=>`<a href="${s.url}">▶︎ Reel${a.length>1?" "+(i+1):""}</a>`).join("")}${f.sources.some(s=>!s.url)?`<span class="sub">📝 ${f.sources.filter(s=>!s.url).map(s=>s.note).join(", ")}</span>`:""}</div></article>`}
function render(){
  const L=filtered();
  $("#count").textContent=L.length+" adresse"+(L.length>1?"s":"")+(me?" · triées par distance":"");
  $("#list").innerHTML=L.map(card).join("")||'<div class="sub">Aucune adresse dans ce rayon. Augmentez-le ou touchez « Toute distance ».</div>';
  if(view==="carte")drawMap(L);
  nearby(L)}
function drawMap(L){
  if(!map){map=L_.map("map",{zoomControl:true}).setView([48.8566,2.3522],12);
    L_.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);layer=L_.layerGroup().addTo(map)}
  layer.clearLayers();const pts=[];
  L.filter(f=>f.geo).forEach(f=>{const g=f.geo;pts.push([g.lat,g.lng]);
    L_.marker([g.lat,g.lng],{icon:L_.divIcon({className:"",html:`<div class="pin ${g.fiabilite}"></div>`,iconSize:[18,18]})}).addTo(layer)
     .bindPopup(`<b>${f.nom}</b><br>${[f.cuisine,f.quartier||f.ville].filter(Boolean).join(" · ")}${f._d!=null?"<br>"+fmt(f._d):""}<br><a href="${plans(f)}">📍 Y aller (Plans)</a>`)});
  if(me){if(meMarker)meMarker.remove();meMarker=L_.marker([me.lat,me.lng],{icon:L_.divIcon({className:"",html:'<div class="me"></div>',iconSize:[16,16]})}).addTo(map);pts.push([me.lat,me.lng])}
  setTimeout(()=>{map.invalidateSize();if(pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:me?15:13})},50)}
let lastAlert=null;
function nearby(L){const n=L.filter(f=>f._d!=null&&f._d<=0.3&&f.geo&&f.geo.fiabilite!=="approx")[0];const b=$("#banner");
  if(me&&n){b.style.display="block";b.textContent=`📍 Vous êtes à ${fmt(n._d)} de « ${n.nom} » (${n.cuisine||n.sous_type})`;
    if(lastAlert!==n.id&&navigator.vibrate){navigator.vibrate(120)};lastAlert=n.id}else b.style.display="none"}
function setView(v){view=v;$("#tl").classList.toggle("on",v==="liste");$("#tm").classList.toggle("on",v==="carte");
  $("#list").style.display=v==="liste"?"grid":"none";$("#mapwrap").style.display=v==="carte"?"block":"none";render()}
$("#tl").onclick=()=>setView("liste");$("#tm").onclick=()=>setView("carte");
$("#loc").onclick=()=>{if(!navigator.geolocation){alert("Géolocalisation indisponible");return}
  $("#loc").textContent="📍 Localisation…";
  if(watch)navigator.geolocation.clearWatch(watch);
  watch=navigator.geolocation.watchPosition(p=>{me={lat:p.coords.latitude,lng:p.coords.longitude};$("#loc").textContent="📍 Position suivie";render()},
    e=>{$("#loc").textContent="📍 Autour de moi";alert("Position refusée ou indisponible. Autorisez la localisation pour ce site dans Réglages > Safari > Position.")},
    {enableHighAccuracy:true,maximumAge:15000,timeout:20000})};
["q","ville","cuisine","rayon"].forEach(i=>$("#"+i).addEventListener("input",render));
const L_=window.L;render();
</script></body></html>
